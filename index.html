<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drag and Drop List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Drag & Drop List</h1>

        <p class="subtitle">
            Drag the items to rearrange the list
        </p>

        <ul id="dragList">

            <li draggable="true">
                <span class="drag-icon">☰</span>
                HTML
            </li>

            <li draggable="true">
                <span class="drag-icon">☰</span>
                CSS
            </li>

            <li draggable="true">
                <span class="drag-icon">☰</span>
                JavaScript
            </li>

            <li draggable="true">
                <span class="drag-icon">☰</span>
                React
            </li>

            <li draggable="true">
                <span class="drag-icon">☰</span>
                Python
            </li>

        </ul>

        <p id="message">
            Drag an item to change its position.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
